<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peskei's Server</title>
    <style>
        :root {
            --primary-color: #4caf50; /* Minecraft Green */
            --secondary-color: #2196f3; /* Golf It Blue */
            --bg-color: #1a1a1a;
            --text-color: #f4f4f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            padding: 2rem;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ccc;
        }

        .game-list {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .game-tag {
            background: #333;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            border: 1px solid var(--secondary-color);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Peskei's Server</h1>
        <p>
            ようこそ！ここでは <strong>Minecraft</strong> や <strong>DCG</strong> を中心に、<br>
            みんなでマルチプレイを楽しんでいます。
        </p>

        <div class="game-list">
            <span class="game-tag">Minecraft</span>
            <span class="game-tag">DCG</span>
            <span class="game-tag">and more...</span>
        </div>

        <div class="footer">
            &copy; 2026 Peskei's Server. Hosted on GitHub Pages.
        </div>
    </div>

</body>
</html>
